<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Lantern World</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #070d22; }
  canvas { display: block; }
  h1 {
    position: fixed; left: 5vw; top: 5vh; margin: 0; z-index: 2;
    font: 800 clamp(40px, 5vw, 84px)/1 Nunito, Quicksand, "Segoe UI", system-ui, sans-serif;
    color: #f4ead8; text-shadow: 0 0 24px rgba(156, 194, 255, 0.6);
  }
</style>
<script type="importmap">{"imports": {"three": "/stage-libs/three/0.186.1/three.module.js"}}</script>
</head>
<body>
<h1>Lantern World</h1>
<script type="module">
import * as THREE from "three";

// ===== SETTINGS: change these first =====
const SETTINGS = {
  planetColor: 0x3d6cc4,
  glowColor: 0x9cc2ff,
  ringColor: 0xffb55e,
  moons: [                       // radius of orbit, size, speed, colour
    { orbit: 5.2, size: 0.45, speed: 0.6, color: 0xff6f9c },
    { orbit: 7.4, size: 0.7, speed: 0.35, color: 0x5fe3c8 },
    { orbit: 9.6, size: 0.35, speed: 0.22, color: 0xf4ead8 },
  ],
  stars: 2500,
  cameraDistance: 17,
};

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070d22);
scene.fog = new THREE.FogExp2(0x070d22, 0.018);
const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, 0.1, 400);

// Lights: a warm key light and a cool rim, like lamps against a night window.
scene.add(new THREE.AmbientLight(0x6f86c9, 0.35));
const key = new THREE.PointLight(0xffd9a8, 520, 80);
key.position.set(10, 8, 12);
scene.add(key);
const rim = new THREE.DirectionalLight(0x9cc2ff, 1.4);
rim.position.set(-12, 4, -8);
scene.add(rim);

// The planet, with a soft halo made from a back-facing shell.
const planet = new THREE.Mesh(
  new THREE.SphereGeometry(3, 64, 64),
  new THREE.MeshStandardMaterial({ color: SETTINGS.planetColor, roughness: 0.55, metalness: 0.1,
    emissive: 0x13254a, emissiveIntensity: 0.6 })
);
scene.add(planet);
const halo = new THREE.Mesh(
  new THREE.SphereGeometry(3.45, 48, 48),
  new THREE.MeshBasicMaterial({ color: SETTINGS.glowColor, transparent: true, opacity: 0.12,
    side: THREE.BackSide, blending: THREE.AdditiveBlending })
);
scene.add(halo);

// A ring of glowing lanterns around the planet.
const ring = new THREE.Group();
const lanternGeo = new THREE.SphereGeometry(0.09, 10, 10);
const lanternMat = new THREE.MeshBasicMaterial({ color: SETTINGS.ringColor });
for (let i = 0; i < 160; i++) {
  const a = (i / 160) * Math.PI * 2;
  const r = 4.1 + Math.sin(i * 1.7) * 0.25;
  const lantern = new THREE.Mesh(lanternGeo, lanternMat);
  lantern.position.set(Math.cos(a) * r, Math.sin(i * 3.1) * 0.08, Math.sin(a) * r);
  ring.add(lantern);
}
ring.rotation.x = 0.35;
scene.add(ring);

// Moons on their orbits.
const moons = SETTINGS.moons.map((m) => {
  const pivot = new THREE.Group();
  const moon = new THREE.Mesh(
    new THREE.SphereGeometry(m.size, 32, 32),
    new THREE.MeshStandardMaterial({ color: m.color, emissive: m.color, emissiveIntensity: 0.45, roughness: 0.4 })
  );
  moon.position.x = m.orbit;
  pivot.add(moon);
  pivot.rotation.z = (Math.random() - 0.5) * 0.5;
  scene.add(pivot);
  const path = new THREE.Mesh(
    new THREE.TorusGeometry(m.orbit, 0.012, 6, 160),
    new THREE.MeshBasicMaterial({ color: 0x9cc2ff, transparent: true, opacity: 0.25 })
  );
  path.rotation.x = Math.PI / 2;
  pivot.add(path);
  return { pivot, moon, speed: m.speed };
});

// Stars: one Points object, cheap even with thousands.
const starPositions = new Float32Array(SETTINGS.stars * 3);
for (let i = 0; i < SETTINGS.stars; i++) {
  const v = new THREE.Vector3().randomDirection().multiplyScalar(60 + Math.random() * 120);
  starPositions.set([v.x, v.y, v.z], i * 3);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute("position", new THREE.BufferAttribute(starPositions, 3));
const stars = new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xf4ead8, size: 0.5, sizeAttenuation: true }));
scene.add(stars);

const clock = new THREE.Clock();
function frame() {
  const t = clock.getElapsedTime();
  // Slow orbit of the camera, so the scene is always moving.
  camera.position.set(Math.cos(t * 0.12) * SETTINGS.cameraDistance, 5 + Math.sin(t * 0.2) * 2,
    Math.sin(t * 0.12) * SETTINGS.cameraDistance);
  camera.lookAt(0, 0, 0);
  planet.rotation.y = t * 0.15;
  ring.rotation.y = -t * 0.25;
  halo.material.opacity = 0.1 + Math.sin(t * 1.4) * 0.04;
  for (const m of moons) m.pivot.rotation.y = t * m.speed;
  // The repeating moment: every few seconds the lanterns flare.
  lanternMat.color.setHSL(0.09, 1, 0.62 + Math.max(0, Math.sin(t * 1.2)) * 0.25);
  stars.rotation.y = t * 0.01;
  renderer.render(scene, camera);
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
