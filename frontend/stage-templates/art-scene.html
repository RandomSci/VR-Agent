<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Night Over the City</title>
<style>
  :root { --accent: #ffb55e; --accent2: #ff6f9c; --ink: #fff6e6; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #05070f; }
  /* The painting fills the screen and slowly drifts like a film camera. */
  #art { position: fixed; inset: -6%; background-size: cover; background-position: center;
         will-change: transform; filter: saturate(1.08) contrast(1.04); }
  /* A soft beam of light sweeps across now and then. */
  #light { position: fixed; inset: 0; pointer-events: none; mix-blend-mode: screen;
           background: linear-gradient(105deg, transparent 35%, rgba(255, 240, 210, .16) 48%, transparent 60%);
           background-size: 250% 100%; animation: sweep 9s ease-in-out infinite; }
  @keyframes sweep { 0% { background-position: 120% 0; } 60%, 100% { background-position: -40% 0; } }
  #fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #vignette { position: fixed; inset: 0; pointer-events: none;
              background: radial-gradient(ellipse at center, transparent 55%, rgba(0, 0, 0, .55) 100%); }
  /* Title card, bottom left, letters rise in one by one. */
  .card { position: fixed; left: 5vw; bottom: 7vh; max-width: 70vw; color: var(--ink);
          font-family: Nunito, Quicksand, "Segoe UI", system-ui, sans-serif; }
  .card h1 { margin: 0; font-size: clamp(34px, 5.4vw, 92px); font-weight: 900; line-height: 1;
             text-shadow: 0 4px 0 rgba(0, 0, 0, .35), 0 0 34px rgba(255, 111, 156, .45); }
  .card h1 span { display: inline-block; opacity: 0; transform: translateY(30px);
                  animation: rise .7s cubic-bezier(.2, .9, .3, 1.3) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  .card p { margin: 1.4vh 0 0; font-size: clamp(16px, 1.8vw, 28px); font-weight: 700; opacity: 0;
            animation: fade 1s 1.4s forwards; text-shadow: 0 2px 10px rgba(0, 0, 0, .6); }
  .card .bar { width: 0; height: 6px; margin-top: 1.6vh; border-radius: 9px;
               background: linear-gradient(90deg, var(--accent), var(--accent2)); animation: grow 1.2s 1s forwards; }
  @keyframes fade { to { opacity: 1; } }
  @keyframes grow { to { width: min(320px, 40vw); } }
</style>
</head>
<body>
<div id="art"></div>
<div id="light"></div>
<canvas id="fx"></canvas>
<div id="vignette"></div>
<div class="card"><h1 id="title"></h1><p id="subtitle"></p><div class="bar"></div></div>
<script>
// ===== SETTINGS: change these first =====
const SETTINGS = {
  art: "/stage-assets/backgrounds/night-sky.svg",   // the picture (use generated_art when given)
  title: "Night Over the City",
  subtitle: "Painted live on stream",
  colors: ["#ffffff", "#ffd166", "#9cc2ff", "#ff9ecb"],   // particle colours that match the picture
  // Pick what fits the picture: sparkles, stars, fireflies, snow, rain, petals, bokeh, embers, bubbles
  effects: ["sparkles", "bokeh"],
  amount: 1,            // 0.5 calm, 1 normal, 2 busy
  drift: 1,             // camera movement: 0 still, 1 gentle, 2 strong
};

// The Stage plays by itself; on the published page the picture follows the mouse.
const PLAYER = window.GAME_MODE === "player";

// ===== THE PICTURE: a slow film-camera drift (zoom and pan, looping) =====
const art = document.getElementById("art");
art.style.backgroundImage = `url("${SETTINGS.art}")`;
let mouseX = 0, mouseY = 0;
function camera(t) {
  const d = SETTINGS.drift;
  const zoom = 1 + 0.06 * d * (0.5 + 0.5 * Math.sin(t / 7000));
  const x = Math.sin(t / 9000) * 1.6 * d + mouseX * 1.5;
  const y = Math.cos(t / 11000) * 1.0 * d + mouseY * 1.2;
  art.style.transform = `translate(${x}%, ${y}%) scale(${zoom})`;
}

// ===== EFFECTS: particles drawn over the picture =====
const fx = document.getElementById("fx"), ctx = fx.getContext("2d");
function fit() { fx.width = innerWidth; fx.height = innerHeight; }
addEventListener("resize", fit); fit();
const rand = (a, b) => a + Math.random() * (b - a);
const pick = (list) => list[Math.floor(Math.random() * list.length)];
const particles = [];

const KINDS = {
  sparkles: { n: 40, make: () => ({ x: rand(0, 1), y: rand(0, 1), r: rand(5, 14), life: rand(1, 2.5) }) },
  stars:    { n: 90, make: () => ({ x: rand(0, 1), y: rand(0, .55), r: rand(.8, 2.2), life: rand(2, 5) }) },
  fireflies:{ n: 35, make: () => ({ x: rand(0, 1), y: rand(.35, 1), r: rand(2, 4), vx: rand(-.02, .02), vy: rand(-.02, .01), life: rand(3, 7) }) },
  snow:     { n: 160, make: () => ({ x: rand(0, 1), y: rand(-.1, 1), r: rand(1.5, 4), vx: rand(-.01, .01), vy: rand(.03, .08), life: 99 }) },
  rain:     { n: 220, make: () => ({ x: rand(0, 1), y: rand(-.1, 1), r: rand(10, 22), vx: -.02, vy: rand(.7, 1.1), life: 99 }) },
  petals:   { n: 40, make: () => ({ x: rand(0, 1), y: rand(-.1, 1), r: rand(5, 9), vx: rand(.02, .05), vy: rand(.03, .06), spin: rand(0, 6), life: 99 }) },
  bokeh:    { n: 18, make: () => ({ x: rand(0, 1), y: rand(0, 1), r: rand(20, 60), vx: rand(-.005, .005), vy: rand(-.008, -.002), life: rand(5, 10) }) },
  embers:   { n: 60, make: () => ({ x: rand(0, 1), y: rand(.7, 1.1), r: rand(1.5, 3.5), vx: rand(-.01, .01), vy: rand(-.09, -.04), life: rand(2, 5) }) },
  bubbles:  { n: 40, make: () => ({ x: rand(0, 1), y: rand(.5, 1.1), r: rand(4, 14), vx: rand(-.005, .005), vy: rand(-.06, -.02), life: 99 }) },
};
function spawn(kind) {
  const p = KINDS[kind].make();
  p.kind = kind; p.age = 0; p.color = pick(SETTINGS.colors); p.phase = rand(0, 6.28);
  p.vx = p.vx || 0; p.vy = p.vy || 0;
  particles.push(p);
}
SETTINGS.effects.forEach((kind) => {
  if (!KINDS[kind]) return;
  for (let i = 0; i < KINDS[kind].n * SETTINGS.amount; i++) { spawn(kind); particles[particles.length - 1].age = rand(0, 3); }
});

function star4(x, y, r) {
  ctx.beginPath();
  for (let i = 0; i < 8; i++) {
    const a = (i / 8) * Math.PI * 2 - Math.PI / 2, d = i % 2 ? r * .28 : r;
    ctx.lineTo(x + Math.cos(a) * d, y + Math.sin(a) * d);
  }
  ctx.fill();
}
function drawParticle(p, W, H) {
  const x = p.x * W, y = p.y * H, fadeIn = Math.min(1, p.age * 2), fadeOut = p.life < 99 ? Math.max(0, 1 - p.age / p.life) : 1;
  const a = fadeIn * fadeOut;
  ctx.fillStyle = p.color; ctx.strokeStyle = p.color;
  switch (p.kind) {
    case "sparkles": ctx.globalAlpha = a * Math.abs(Math.sin(p.age * 3 + p.phase)); star4(x, y, p.r); break;
    case "stars": ctx.globalAlpha = a * (.4 + .6 * Math.abs(Math.sin(p.age * 2 + p.phase))); ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.28); ctx.fill(); break;
    case "fireflies": case "embers":
      ctx.globalAlpha = a * (.5 + .5 * Math.sin(p.age * 4 + p.phase)); ctx.shadowColor = p.color; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.28); ctx.fill(); ctx.shadowBlur = 0; break;
    case "snow": ctx.globalAlpha = .85; ctx.beginPath(); ctx.arc(x + Math.sin(p.age + p.phase) * 12, y, p.r, 0, 6.28); ctx.fill(); break;
    case "rain": ctx.globalAlpha = .45; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x - p.r * .3, y + p.r); ctx.stroke(); break;
    case "petals":
      ctx.globalAlpha = .9; ctx.save(); ctx.translate(x, y); ctx.rotate(p.spin + p.age * 2);
      ctx.beginPath(); ctx.ellipse(0, 0, p.r, p.r * .55, 0, 0, 6.28); ctx.fill(); ctx.restore(); break;
    case "bokeh": ctx.globalAlpha = a * .18; ctx.beginPath(); ctx.arc(x, y, p.r, 0, 6.28); ctx.fill(); break;
    case "bubbles": ctx.globalAlpha = .55; ctx.lineWidth = 1.5; ctx.beginPath(); ctx.arc(x + Math.sin(p.age * 2 + p.phase) * 6, y, p.r, 0, 6.28); ctx.stroke(); break;
  }
  ctx.globalAlpha = 1;
}

// A burst of sparkles: on stream now and then, on the published page where you click.
function burst(px, py) {
  for (let i = 0; i < 18; i++) {
    const a = rand(0, 6.28), v = rand(.05, .18);
    particles.push({ kind: "sparkles", x: px, y: py, r: rand(6, 14), vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rand(.8, 1.6), age: 0, phase: rand(0, 6), color: pick(SETTINGS.colors), once: true });
  }
}

let last = performance.now();
function frame(now) {
  const dt = Math.min(.05, (now - last) / 1000); last = now;
  camera(now);
  const W = fx.width, H = fx.height;
  ctx.clearRect(0, 0, W, H);
  for (let i = particles.length - 1; i >= 0; i--) {
    const p = particles[i];
    p.age += dt; p.x += p.vx * dt; p.y += p.vy * dt;
    const gone = p.age > p.life || p.y > 1.15 || p.y < -.15 || p.x < -.1 || p.x > 1.1;
    if (gone) { particles.splice(i, 1); if (!p.once) spawn(p.kind); continue; }
    drawParticle(p, W, H);
  }
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);

// ===== TITLE: letters rise in one by one =====
const title = document.getElementById("title");
Array.from(SETTINGS.title).forEach((ch, i) => {
  const span = document.createElement("span");
  span.textContent = ch === " " ? " " : ch;
  span.style.animationDelay = (0.3 + i * 0.05) + "s";
  title.appendChild(span);
});
document.getElementById("subtitle").textContent = SETTINGS.subtitle;
document.title = SETTINGS.title;

// ===== PLAYER (published page): the picture follows the mouse, clicks sparkle =====
if (PLAYER) {
  addEventListener("pointermove", (e) => { mouseX = (e.clientX / innerWidth - .5) * -2; mouseY = (e.clientY / innerHeight - .5) * -2; });
  addEventListener("pointerdown", (e) => burst(e.clientX / innerWidth, e.clientY / innerHeight));
} else {
  setInterval(() => burst(rand(.2, .8), rand(.2, .6)), 2600);
}
</script>
</body>
</html>
