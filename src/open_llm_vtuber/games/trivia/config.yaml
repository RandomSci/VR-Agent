# Trivia Battle. Rules, timers and scores are decided by code, never by an LLM.
id: trivia
display_name: Trivia Battle
description: Two characters and the chat race to answer trivia questions.
aliases: [trivia, trivia battle, quiz, trivia game, quiz game]
enabled: true
players: 2
viewer_participation: true
# Read out when a viewer asks how the game works. Keep it true to the code below.
how_to_play: >-
  A question pops up on the board and it's chat's turn first: you get 12 seconds,
  all to yourselves, to type the answer. If nobody gets it, Mika and Luna take
  their guesses. Every correct answer is a point, and after
  five rounds whoever has the most points wins. Chat plays as one team!

rounds_per_game: 5
default_difficulty: medium          # easy, medium, hard, or mixed
intro_seconds: 3
# Viewer first: chat gets this long, alone, before Mika and Luna may answer. The
# girls never answer (or hint) during chat's turn, and if chat gets it right they
# skip their answers entirely. 12 s covers reading, typing and the YouTube chat
# delay; check /vr-agent/room/status "chat_timing" after a real stream and raise it
# if answers keep arriving late.
viewer_answer_window_seconds: 12
wrong_answers_keep_window: true     # a wrong guess does not end chat's turn
character_think_seconds: 2.5        # pause before a character answers
line_timeout_seconds: 12            # safety net if a spoken line never finishes
reveal_seconds: 4.5
between_rounds_seconds: 2.5
finish_display_seconds: 9

# Viewer answers
max_answer_words: 5                 # longer messages are chat, not answers
typo_tolerance: 0.86                # similarity needed for answers of 5+ letters
viewer_feed_size: 4

# Boredom (local counters only)
bored_after_rounds: 10
bored_after_minutes: 15
